[package]
name = "filefinder-tui"
version = "1.0.2"
edition = "2024"
license = "MIT"

[dependencies]
chrono = "0.4.45"
image = "0.25"
libc = "0.2"
ratatui = "0.30.2"
# Without the default `chafa` feature, which needs a system library.
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm", "image-defaults"] }
toml = "1.2.1"
unicode-width = "0.2.3"

[dev-dependencies]
tempfile = "3.27.0"
